version: '3.8'

# ============================================================================
# INATrace — Fortaleza del Valle (Staging + Producción, ESPAM/CEDIA)
# Verificado contra servidores reales el 2026-07-28:
#   - Staging: 190.15.143.254 (contenedores: inatrace-postgres, inatrace-be,
#     inatrace-kc-test-fortaleza, inatrace-frontend)
#   - Producción: 10.10.102.26 (mismos nombres de contenedor)
# Usado por backend/ci/Jenkinsfile (pipeline exclusivo de Fortaleza).
# ============================================================================

services:

  inatrace-postgres:
    image: postgres:16.10
    container_name: inatrace-postgres
    environment:
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATASOURCE_USERNAME}
    volumes:
      - ${DB_VOLUME}:/var/lib/postgresql/data
    # NOTA: el contenedor real en staging/prod NO publica el puerto 5432 al
    # host (verificado con `docker ps`/`ss -tlnp`). Solo es alcanzable dentro
    # de la red Docker `backend`. No agregar `ports:` aquí sin verificar antes
    # que el firewall del host realmente lo bloquea (Docker puede saltarse UFW).
    networks:
      - backend
    restart: always

  inatrace-keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: inatrace-kc-test-fortaleza
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://inatrace-postgres:5432/inatrace_keycloak
      KC_DB_USERNAME: ${DATASOURCE_USERNAME}
      KC_DB_PASSWORD: ${DATASOURCE_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_FEATURES: organization
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME:-testinatrace.espam.edu.ec}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
    volumes:
      - /opt/inatrace/keycloak-theme/inatrace:/opt/keycloak/themes/inatrace
    ports:
      - '8083:8080'
    networks:
      - backend
    depends_on:
      - inatrace-postgres
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  inatrace-backend:
    image: ${IMAGE_NAME}:${TAG}
    container_name: inatrace-be
    environment:
      - INATRACE_DATABASE_NAME=${DATABASE_NAME}
      - INATRACE_DATABASE_HOSTNAME=inatrace-postgres
      - SPRING_DATASOURCE_USERNAME=${DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}
      - INATRACE_FILESTORAGE_ROOT=${FILE_STORAGE_ROOT}
      - INATRACE_IMPORT_PATH=${IMPORT_PATH}
      - INATRACE_DOCUMENTS_ROOT=${DOCUMENTS_ROOT}
      - INATRACE_REQUESTLOG_TOKEN=${REQUESTLOG_TOKEN}
      - INATRACE_EXCHANGERATE_APIKEY=${EXCHANGERATE_APIKEY}
      - INATRACE_EXCHANGERATE_ENABLED=${EXCHANGERATE_ENABLED:-true}
      # Whisp (analisis de deforestacion). Sin API key la integracion queda
      # apagada y /whisp/status lo reporta; con AgStack sin configurar las
      # parcelas se envian como poligono en vez de por geo id.
      - INATRACE_WHISP_APIKEY=${WHISP_API_KEY:-}
      - INATRACE_AGSTACK_EMAIL=${AGSTACK_EMAIL:-}
      - INATRACE_AGSTACK_PASSWORD=${AGSTACK_PASSWORD:-}
      - INATRACE_AGSTACK_BASEURL=${AGSTACK_BASE_URL:-}
      - INATRACE_AGSTACK_LOGINBASEURL=${AGSTACK_LOGIN_BASE_URL:-}
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${ISSUER_URI}
      - INATRACE_KEYCLOAK_ADMIN_SERVER_URL=${KEYCLOAK_ADMIN_SERVER_URL:-http://inatrace-kc-test-fortaleza:8080/auth}
      # ⚠️ El realm difiere por entorno (verificado 2026-08-06 consultando la
      # tabla `realm` de cada servidor):
      #   - staging  190.15.143.254 -> master, inatrace, fortaleza
      #   - producción 10.10.102.26 -> master, inatrace_fortaleza
      # Por eso este default `inatrace_fortaleza` es CORRECTO para producción
      # (el .env de prod no define KEYCLOAK_ADMIN_REALM y usa el default) y
      # equivocado para staging, donde el .env sí debe definirlo como
      # `fortaleza`. Una nota anterior aquí afirmaba lo contrario: era una
      # verificación hecha solo contra staging. No unificar sin migrar el realm.
      - INATRACE_KEYCLOAK_ADMIN_REALM=${KEYCLOAK_ADMIN_REALM:-inatrace_fortaleza}
      - INATRACE_KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-inatrace-backend}
      - INATRACE_KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-backend-secret-123}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health | grep -E '200|401' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ${FILE_STORAGE_ROOT_VOL}:${FILE_STORAGE_ROOT}
      - ${IMPORT_PATH_VOL}:${IMPORT_PATH}
      - ${DOCUMENTS_ROOT_VOL}:${DOCUMENTS_ROOT}
    networks:
      - backend
    depends_on:
      - inatrace-postgres
    ports:
      - "${BE_HOST_PORT:-8080}:8080"
    restart: always
    extra_hosts:
      - "inatrace.espam.edu.ec:host-gateway"
      - "testinatrace.espam.edu.ec:host-gateway"

networks:
  backend:
    name: inatrace-backend-network
    external: true
