# ============================================================================
# PostgreSQL 16 Tuning Configuration — INATrace Production / Staging
# Architecture: ADR-014 (Rendimiento: optimizar antes de distribuir)
# Task: HU-08 (Indexación y afinado de parámetros en PostgreSQL)
# Hardware Target: 4 Cores, 8 GB RAM, SSD Storage (CEDIA / Hetzner)
# ============================================================================

# ----------------------------------------------------------------------------
# CONNECTIONS AND NETWORKING
# ----------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 100
tcp_keepalives_idle = 300
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# ----------------------------------------------------------------------------
# MEMORY CONFIGURATION (Tuned for 8 GB RAM host)
# ----------------------------------------------------------------------------
# 25% of total system RAM for shared buffers
shared_buffers = 1GB

# Estimation of memory available for disk caching by OS + PostgreSQL
effective_cache_size = 3GB

# Memory used per sort/hash operation before spilling to disk
work_mem = 16MB

# Memory used for maintenance operations (VACUUM, CREATE INDEX, ALTER TABLE)
maintenance_work_mem = 256MB

# Dynamic shared memory type
dynamic_shared_memory_type = posix

# ----------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL) & CHECKPOINTS
# ----------------------------------------------------------------------------
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 1GB
max_wal_size = 4GB

# ----------------------------------------------------------------------------
# QUERY PLANNER COST MODEL (Tuned for NVMe/SSD storage)
# ----------------------------------------------------------------------------
# Default 4.0 assumes spinning disk; 1.1 matches SSD random read speed
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# Planner statistics granularity
default_statistics_target = 100

# ----------------------------------------------------------------------------
# PARALLEL QUERY EXECUTION
# ----------------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ----------------------------------------------------------------------------
# LOGGING AND MONITORING (Slow queries > 1000ms)
# ----------------------------------------------------------------------------
# In Docker containers, logging_collector must be off so logs go to stderr/stdout
# and are captured by docker logs.
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ----------------------------------------------------------------------------
# AUTOVACUUM (Prevent transaction ID wraparound and table bloat)
# ----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 500

# ----------------------------------------------------------------------------
# LOCALE AND ENCODING
# ----------------------------------------------------------------------------
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
