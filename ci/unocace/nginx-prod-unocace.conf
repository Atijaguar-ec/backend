# ============================================================================
# nginx del HOST para la produccion nueva de UNOCACE
# Destino: /etc/nginx/sites-available/inatrace-unocace-prod
#
# Deriva del sitio de staging (95.217.182.220), con tres correcciones:
#   - Un solo bloque .mjs. En staging hay TRES duplicados acumulados; nginx usa
#     el primero y los otros dos solo confunden a quien lea el archivo.
#   - Sin bloque /bi/: en produccion no hay Superset. Si se publica alguna vez,
#     se agrega aqui Y se despliega el contenedor; dejar la ruta sin servicio
#     detras hace que el iframe de "Reportes & BI" cargue INATrace dentro de
#     INATrace. Ver fe/agent-context.md seccion 18.
#   - Un solo `server_name` por bloque. La produccion heredada tiene dos sitios
#     habilitados a la vez, uno con `server_name _`. Funciona de casualidad.
#
# Tras cualquier cambio: `nginx -t`, recargar, y comprobar a mano que la
# consola de Keycloak llega a la pantalla de login. Ver el aviso de abajo.
# ============================================================================

server {
    listen 80;
    server_name inatrace.unocace.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inatrace.unocace.com;

    ssl_certificate     /etc/letsencrypt/live/inatrace.unocace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inatrace.unocace.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # El frontend se sirve como archivos estaticos, no desde un contenedor.
    # El workflow de GitHub Actions los sincroniza aqui con rsync --delete.
    root  /var/www/inatrace-fe-dist;
    index index.html;

    client_max_body_size 50M;      # importaciones de GeoJSON y documentos

    add_header Permissions-Policy   "unload=*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # =====================================================================
    # AVISO — NO QUITAR EL ^~ DE LOS location CON proxy_pass
    #
    # En nginx las regex (location ~*) GANAN a los prefijos simples
    # (location /ruta/). Sin el ^~, el bloque `location ~* \.(html|js)$` de
    # mas abajo captura cualquier .js bajo /auth/ y /api/, y como no proxea,
    # nginx lo busca en root /var/www/inatrace-fe-dist -> 404.
    # Sintoma: la consola de Keycloak se queda en "Loading the Administration
    # Console" para siempre.
    #
    # El ^~ hace que el prefijo gane y detenga la evaluacion de las regex.
    # Si agregas una regex por extension, comprueba que no capture rutas
    # proxeadas.
    #
    # Detalle: ina-docs/operacion/nginx-location-regex-vs-prefijo.md
    # =====================================================================

    # Modulos ES: .mjs no esta en el mime.types estandar de nginx, que
    # devuelve application/octet-stream y el navegador bloquea el modulo.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # El index y los bundles no se cachean: un despliegue debe verse enseguida.
    location ~* \.(html|js|json)$ {
        add_header Permissions-Policy "unload=*" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8082/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;        # importaciones y exportaciones largas
        client_max_body_size 50M;
    }

    location ^~ /auth/ {
        proxy_pass         http://127.0.0.1:8083/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_http_version 1.1;
        # Keycloak manda cabeceras grandes al redirigir tras el login.
        proxy_buffer_size  64k;
        proxy_buffers      8 64k;
    }

    # Capa WMS del Ministerio del Ambiente, usada por los mapas de parcelas.
    location /wms {
        proxy_pass       http://ide.ambiente.gob.ec:8080/geoserver/mae_ide/wms;
        proxy_set_header Host ide.ambiente.gob.ec;
    }

    # El SPA resuelve sus propias rutas. Va al final: cualquier cosa que no
    # haya casado antes termina aqui, y por eso /bi/ devolveria el index.html
    # en vez de un 404 honesto si alguien lo pidiera.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
