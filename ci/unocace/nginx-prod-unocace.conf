# ============================================================================
# nginx del HOST para la produccion nueva de UNOCACE
# Destino: /etc/nginx/sites-available/inatrace-unocace-prod
#
# Deriva del sitio de staging (95.217.182.220), con tres correcciones:
#   - Un solo bloque .mjs. En staging hay TRES duplicados acumulados; nginx usa
#     el primero y los otros dos solo confunden a quien lea el archivo.
#   - Con bloque /bi/: desde el 2026-10-20 Superset SI corre en produccion
#     (inatrace-bi-superset-unocace, 127.0.0.1:8088). Si se quita la ruta, el
#     iframe de "Reportes & BI" carga INATrace dentro de INATrace. Ver
#     fe/agent-context.md seccion 18.
#   - Un solo `server_name` por bloque. La produccion heredada tiene dos sitios
#     habilitados a la vez, uno con `server_name _`. Funciona de casualidad.
#
# Tras cualquier cambio: `nginx -t`, recargar, y comprobar a mano que la
# consola de Keycloak llega a la pantalla de login. Ver el aviso de abajo.
# ============================================================================

server {
    listen 80;
    server_name inatrace.unocace.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inatrace.unocace.com;

    ssl_certificate     /etc/letsencrypt/live/inatrace.unocace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inatrace.unocace.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # El frontend se sirve como archivos estaticos, no desde un contenedor.
    # El workflow de GitHub Actions los sincroniza aqui con rsync --delete.
    root  /var/www/inatrace-fe-dist;
    index index.html;

    client_max_body_size 50M;      # importaciones de GeoJSON y documentos

    add_header Permissions-Policy   "unload=*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # =====================================================================
    # AVISO — NO QUITAR EL ^~ DE LOS location CON proxy_pass
    #
    # En nginx las regex (location ~*) GANAN a los prefijos simples
    # (location /ruta/). Sin el ^~, el bloque `location ~* \.(html|js)$` de
    # mas abajo captura cualquier .js bajo /auth/ y /api/, y como no proxea,
    # nginx lo busca en root /var/www/inatrace-fe-dist -> 404.
    # Sintoma: la consola de Keycloak se queda en "Loading the Administration
    # Console" para siempre.
    #
    # El ^~ hace que el prefijo gane y detenga la evaluacion de las regex.
    # Si agregas una regex por extension, comprueba que no capture rutas
    # proxeadas.
    #
    # Detalle: ina-docs/operacion/nginx-location-regex-vs-prefijo.md
    # =====================================================================

    # Modulos ES: .mjs no esta en el mime.types estandar de nginx, que
    # devuelve application/octet-stream y el navegador bloquea el modulo.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # El index y los bundles no se cachean: un despliegue debe verse enseguida.
    location ~* \.(html|js|json)$ {
        add_header Permissions-Policy "unload=*" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8082/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;        # importaciones y exportaciones largas
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }

    location ^~ /auth/ {
        proxy_pass         http://127.0.0.1:8083/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # Keycloak manda cabeceras grandes al redirigir tras el login.
        proxy_buffer_size       64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size 64k;
    }

    # Capa WMS del Ministerio del Ambiente, usada por los mapas de parcelas.
    location /wms {
        proxy_pass            http://ide.ambiente.gob.ec:8080/geoserver/mae_ide/wms;
        proxy_set_header      Host ide.ambiente.gob.ec;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Accept "image/png,image/*;q=0.8,*/*;q=0.5";
        proxy_http_version    1.1;
        proxy_read_timeout    120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_buffering       off;
        proxy_redirect        http://ide.ambiente.gob.ec:8080/geoserver/mae_ide/wms /wms;
    }

    # Superset (Reportes & BI). Desplegado y en uso desde el 2026-10-20.
    location ^~ /bi/ {
        # Corrige doble prefijo (/bi/bi/) generado por clientes Superset al exportar reportes (CSV/Excel)
        rewrite ^/bi/bi/(.*)$ /bi/$1 last;

        # Sin slash final: Superset 6.x necesita recibir /bi para activar
        # SUPERSET_APP_ROOT y construir correctamente sus rutas públicas.
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Prefix /bi;
        proxy_set_header X-Script-Name     /bi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_redirect off;
    }

    # INATrace FastMCP Server (JSON-RPC 2.0 & Server-Sent Events)
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8085/.well-known/oauth-protected-resource;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El SPA resuelve sus propias rutas. Va al final: cualquier cosa que no
    # haya casado antes termina aqui.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
