# ============================================================================
# 🍫 Backend CI/CD - UNOCACE (Staging)
# ============================================================================
# Despliega el backend de UNOCACE en 95.217.182.220 (/opt/inatrace-test/),
# verificado en vivo el 2026-07-28. Reemplaza el workflow anterior, que
# apuntaba a /opt/inatrace/backend (ruta muerta desde abril), asumía un
# contenedor MySQL inexistente y esperaba un service "backend" que no
# coincidía con el compose real. La infraestructura real es PostgreSQL 16 +
# Keycloak 26 (ver backend/ci/unocace/docker-compose.yml).
#
# Triggers:
# - push a `staging`               → deploy automático, camino GHCR (imagen)
# - workflow_dispatch              → manual, elegir delivery_method:
#     - image    (default): build+push a GHCR, servidor hace pull
#     - jar_scp  (emergencia): compila jar, lo sube por scp, build local en
#       el servidor con backend/ci/unocace/Dockerfile (sin depender de GHCR)
#
# No se sobreescribe /opt/inatrace-test/.env completo: solo se actualizan
# las líneas IMAGE_NAME/TAG. Los secretos de Postgres/Keycloak/admin ya
# viven ahí (rotados y con permisos 600) y no se gestionan desde CI.
# ============================================================================

name: 🍫 Backend UNOCACE

on:
  push:
    branches:
      - staging
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "backend/ci/unocace/**"
      - ".github/workflows/deploy-backend-unocace.yml"
  workflow_dispatch:
    inputs:
      delivery_method:
        description: "Mecanismo de entrega del artefacto"
        required: true
        default: "image"
        type: choice
        options:
          - image
          - jar_scp
      skip_quality:
        description: "Omitir pruebas"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-inatrace
  JAVA_VERSION: "17"
  REMOTE_DIR: /opt/inatrace-test
  COMPANY_NAME: UNOCACE
  PRIMARY_PRODUCT_TYPE: COCOA

jobs:
  # ============================================================================
  # Quality (Postgres — NO MySQL; el proyecto migró por completo)
  # ============================================================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_quality }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inatrace
          POSTGRES_USER: inatrace
          POSTGRES_PASSWORD: inatrace
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U inatrace" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: 🔍 Run tests
        continue-on-error: true
        run: mvn clean test -B

  # ============================================================================
  # Build jar (siempre — lo usan ambos delivery_method)
  # ============================================================================
  build-jar:
    name: 🏗️ Build jar
    runs-on: ubuntu-latest
    needs: [quality]
    if: always() && !cancelled()
    outputs:
      deploy-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: 🏷️ Generate tag
        id: meta
        run: echo "tag=unocace-staging-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Rename jar
        run: cp target/*.jar target/app.jar

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 3

  # ============================================================================
  # Build & push a GHCR (solo si delivery_method == image)
  # ============================================================================
  build-image:
    name: 🏗️ Build & Push GHCR
    runs-on: ubuntu-latest
    needs: [build-jar]
    if: github.event_name == 'push' || github.event.inputs.delivery_method == 'image'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute image ref
        id: image_ref
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: "🏗️ Build and push (multi-stage - backend/Dockerfile)"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_ref.outputs.image }}:${{ needs.build-jar.outputs.deploy-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build complete
        run: echo "📦 Imagen publicada - ${{ steps.image_ref.outputs.image }}:${{ needs.build-jar.outputs.deploy-tag }}"

  # ============================================================================
  # Deploy Staging — camino GHCR (pull de imagen)
  # ============================================================================
  deploy-image:
    name: 🚀 Deploy UNOCACE Staging (imagen GHCR)
    runs-on: ubuntu-latest
    needs: [build-jar, build-image]
    if: github.event_name == 'push' || github.event.inputs.delivery_method == 'image'
    environment:
      name: unocace-staging
      url: https://inatrace.test.unocace.com
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Preflight
        run: |
          missing=0
          [ -z "${{ secrets.TEST_UNOCACE_HOST }}" ] && echo "❌ TEST_UNOCACE_HOST" && missing=1
          [ -z "${{ secrets.TEST_UNOCACE_USER }}" ] && echo "❌ TEST_UNOCACE_USER" && missing=1
          [ -z "${{ secrets.TEST_UNOCACE_PASSWORD }}" ] && echo "❌ TEST_UNOCACE_PASSWORD" && missing=1
          [ "$missing" -ne 0 ] && exit 1
          echo "✅ Secrets SSH presentes"

      - name: 📤 Upload docker-compose.yml + Dockerfile (mantener servidor sincronizado con el repo)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          source: "backend/ci/unocace/docker-compose.yml,backend/ci/unocace/Dockerfile"
          target: "${{ env.REMOTE_DIR }}/"
          strip_components: 3

      - name: 📝 Actualizar IMAGE_NAME/TAG en .env existente (sin tocar secretos ya rotados)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          script: |
            set -e
            cd ${{ env.REMOTE_DIR }}
            IMAGE_NAME="ghcr.io/${{ github.repository }}-inatrace"
            IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            TAG="${{ needs.build-jar.outputs.deploy-tag }}"
            grep -q "^IMAGE_NAME=" .env && sed -i "s|^IMAGE_NAME=.*|IMAGE_NAME=${IMAGE_NAME}|" .env || echo "IMAGE_NAME=${IMAGE_NAME}" >> .env
            grep -q "^TAG=" .env && sed -i "s|^TAG=.*|TAG=${TAG}|" .env || echo "TAG=${TAG}" >> .env
            chmod 600 .env
            echo "✅ .env actualizado (IMAGE_NAME=${IMAGE_NAME}, TAG=${TAG})"

      - name: 🚀 Pull & recrear solo el servicio backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          script: |
            set -e
            cd ${{ env.REMOTE_DIR }}
            echo "📥 Pulling image..."
            docker compose pull backend
            echo "🚀 Recreando backend..."
            docker compose up -d --no-deps --force-recreate backend

      - name: ⏳ Health check (local, vía SSH)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          script: |
            for i in $(seq 1 18); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8082/actuator/health || echo 000)
              if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
                echo "✅ Backend UNOCACE staging saludable (HTTP $CODE)"
                exit 0
              fi
              echo "⏳ Intento $i/18 (HTTP $CODE)..."
              sleep 10
            done
            echo "❌ Health check falló"
            docker logs inatrace-be-test-pg-unocace --tail 80
            exit 1

  # ============================================================================
  # Deploy Staging — camino de emergencia (jar por scp + build local)
  # ============================================================================
  deploy-jar-scp:
    name: 🚑 Deploy UNOCACE Staging (jar por scp, emergencia)
    runs-on: ubuntu-latest
    needs: [build-jar]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.delivery_method == 'jar_scp'
    environment:
      name: unocace-staging
      url: https://inatrace.test.unocace.com
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Preflight
        run: |
          missing=0
          [ -z "${{ secrets.TEST_UNOCACE_HOST }}" ] && echo "❌ TEST_UNOCACE_HOST" && missing=1
          [ -z "${{ secrets.TEST_UNOCACE_USER }}" ] && echo "❌ TEST_UNOCACE_USER" && missing=1
          [ -z "${{ secrets.TEST_UNOCACE_PASSWORD }}" ] && echo "❌ TEST_UNOCACE_PASSWORD" && missing=1
          [ "$missing" -ne 0 ] && exit 1

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: 📤 Upload docker-compose.yml + Dockerfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          source: "backend/ci/unocace/docker-compose.yml,backend/ci/unocace/Dockerfile"
          target: "${{ env.REMOTE_DIR }}/"
          strip_components: 3

      - name: 📤 Upload app.jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          source: "app.jar"
          target: "${{ env.REMOTE_DIR }}/"

      - name: 🚑 Build local y recrear backend (sin GHCR)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          script: |
            set -e
            cd ${{ env.REMOTE_DIR }}
            echo "🏗️ Build local a partir de app.jar..."
            docker compose build backend
            echo "🚀 Recreando backend..."
            docker compose up -d --no-deps --force-recreate backend

      - name: ⏳ Health check (local, vía SSH)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_UNOCACE_HOST }}
          username: ${{ secrets.TEST_UNOCACE_USER }}
          password: ${{ secrets.TEST_UNOCACE_PASSWORD }}
          script: |
            for i in $(seq 1 18); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8082/actuator/health || echo 000)
              if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
                echo "✅ Backend UNOCACE staging saludable (HTTP $CODE)"
                exit 0
              fi
              echo "⏳ Intento $i/18 (HTTP $CODE)..."
              sleep 10
            done
            echo "❌ Health check falló"
            docker logs inatrace-be-test-pg-unocace --tail 80
            exit 1
