# ============================================================
# application.properties — TEST ENVIRONMENT
# ============================================================

INATrace.env = TEST

spring.main.banner-mode = off

# Server settings
server.forward-headers-strategy = framework
server.port = 8082

management.health.mail.enabled = false

# To allow uploads of large files (images)
spring.servlet.multipart.max-file-size = 10MB

# increase async request timeout (in milliseconds)
spring.mvc.async.request-timeout = 120000

# Springdoc
springdoc.default-produces-media-type = application/json

# ============================================================
# DataSource — H2 in-memory with PostgreSQL mode
# ============================================================
INATrace.database.name = testdb
INATrace.database.hostname = localhost
INATrace.database.port = 5432

spring.datasource.url = jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =

spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.autocommit = true
spring.jmx.enabled = false

spring.jpa.properties.hibernate.dialect = com.abelium.inatrace.configuration.CustomH2Dialect

# ============================================================
# Flyway — disabled for in-memory H2 schema tests
# ============================================================
spring.flyway.enabled = false

# ============================================================
# Jackson
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps = false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds = false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds = false
spring.jackson.default-property-inclusion = non_null

# Thymeleaf
spring.thymeleaf.mode = HTML
spring.thymeleaf.cache = false

# ============================================================
# Mail
# ============================================================
spring.mail.properties.mail.smtp.connectiontimeout = 5000
spring.mail.properties.mail.smtp.timeout = 3000
spring.mail.properties.mail.smtp.writetimeout = 5000
spring.mail.properties.mail.debug = false
spring.mail.host = localhost
spring.mail.port = 1025

INATrace.mail.template.from = dev@inatrace.local
INATrace.mail.redirect =
INATrace.mail.sendingEnabled = false
INATrace.loginManager.mail = dev@inatrace.local
INATrace.info.mail = dev@inatrace.local

# ============================================================
# Auth / JWT (Keycloak OIDC)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/fortaleza

# ============================================================
# Paths
# ============================================================
INATrace.import.path = import/
INATrace.documents.root = documents/
INATrace.fileStorage.root = /tmp/inatrace_file_storage

# ============================================================
# URLs
# ============================================================
INATrace.emailConfirmation.url = http://localhost:4200/confirm-email/
INATrace.passwordReset.url = http://localhost:4200/reset-password/
INATrace.fe.url = http://localhost:4200

# ============================================================
# Integraciones externas
# ============================================================
INATrace.maxmindDB.path =
INATrace.requestLog.token =
INAtrace.exchangerate.apiKey =
beyco.oauth2.clientId =
beyco.oauth2.clientSecret =
beyco.oauth2.url =
beyco.integration.url =
INATrace.agstack.email =
INATrace.agstack.password =
INATrace.agstack.baseURL =
INATrace.agstack.loginBaseURL =

INATrace.whisp.baseURL = https://whisp.openforis.org/api
INATrace.whisp.apiKey =

# ============================================================
# Keycloak Admin Client
# ============================================================
inatrace.keycloak.admin.server-url = http://localhost:8080
inatrace.keycloak.admin.realm = fortaleza
inatrace.keycloak.admin.client-id = inatrace-backend
inatrace.keycloak.admin.client-secret = backend-secret-123
