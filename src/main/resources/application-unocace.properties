# ============================================================
# Profile: Unocace (Cacao)
# ============================================================
INATrace.database.name = inatrace_unocace_stage
spring.security.oauth2.resourceserver.jwt.issuer-uri = http://localhost:8080/realms/unocace
inatrace.keycloak.admin.realm = unocace

# API de integración Mieru Cacao: alcance de la credencial M2M (RF §4.1 "Limited scope").
# Lista confirmada por el dueño de producto el 2026-11-04, ampliada con el id 1 el 2026-11-05.
#
#   1  UNOCACE                  — sin datos operativos propios; está en la lista porque Mieru
#                                 conoce a las empresas sólo por nombre y resuelve los IDs con
#                                 GET /companies (RF §4.3). Sin ella no puede resolver
#                                 "UNOCACE", que el RF §4.1 nombra explícitamente. Expone su
#                                 ficha (id, nombre, razón social, RUC), no datos personales.
#   4  ASOPROTEN                — datos operativos
#   7  La Cruz                  — datos operativos
#   8  Unión y Progreso         — datos operativos (embarque 9 y entrega 2 de CP-05/CP-06)
#   11 ASOPROMIPRO              — datos operativos
#   15 Villanueva               — datos operativos
#
# Cualquier empresa fuera de esta lista recibe 403 FORBIDDEN_TENANT_ACCESS. No ampliarla
# sin el acuerdo de cesión de datos firmado por la empresa afectada (RF §5): lo que se
# expone son datos personales de agricultores bajo LOPDP.
INATrace.integration.allowedCompanyIds = 1,4,7,8,11,15

# Migraciones de datos exclusivas de este tenant (ver agent-context.md, seccion 28).
# Rango de versiones reservado para UNOCACE: V12xx
spring.flyway.locations = classpath:db/migration,classpath:db/tenant/unocace
