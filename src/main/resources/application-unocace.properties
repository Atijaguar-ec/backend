# ============================================================
# Profile: Unocace (Cacao)
# ============================================================
INATrace.database.name = inatrace_unocace_stage
spring.security.oauth2.resourceserver.jwt.issuer-uri = http://localhost:8080/realms/unocace
inatrace.keycloak.admin.realm = unocace

# API de integración Mieru Cacao: alcance de la credencial M2M (RF §4.1 "Limited scope").
#
# "*" = todas las empresas ACTIVE de esta instancia. Es lo correcto aquí: este despliegue es
# mono-cliente y todas sus empresas son UNOCACE y sus asociaciones, que es precisamente el
# alcance que pide el requerimiento. Una asociación nueva entra en el alcance sola, sin tocar
# configuración ni redesplegar.
#
# Si alguna asociación no firmara el acuerdo de cesión de datos (RF §5), aquí se pone la lista
# explícita de IDs permitidos en lugar de "*" y el resto recibe 403 FORBIDDEN_TENANT_ACCESS.
#
# Esta clave NO debe llevar "*" en un despliegue que aloje a más de un cliente.
INATrace.integration.allowedCompanyIds = *

# Migraciones de datos exclusivas de este tenant (ver agent-context.md, seccion 28).
# Rango de versiones reservado para UNOCACE: V12xx
spring.flyway.locations = classpath:db/migration,classpath:db/tenant/unocace
