# ============================================================
# Profile: Fortaleza del Valle (Cacao)
# ============================================================
INATrace.database.name = inatrace_fortaleza_stage
spring.security.oauth2.resourceserver.jwt.issuer-uri = http://localhost:8080/realms/fortaleza
inatrace.keycloak.admin.realm = fortaleza

# Migraciones de datos exclusivas de este tenant (ver agent-context.md, seccion 28).
# Rango de versiones reservado para Fortaleza del Valle: V11xx
spring.flyway.locations = classpath:db/migration,classpath:db/tenant/fv

# Superset BI Embedded Gateway (Fortaleza del Valle)
inatrace.bi.superset.organization-slug = ${INATRACE_BI_SUPERSET_ORGANIZATION_SLUG:fortaleza}
inatrace.bi.superset.environment = ${INATRACE_BI_SUPERSET_ENVIRONMENT:staging}
inatrace.bi.superset.internal-url = ${INATRACE_BI_SUPERSET_INTERNAL_URL:}
inatrace.bi.superset.public-domain = ${INATRACE_BI_SUPERSET_PUBLIC_DOMAIN:https://testinatrace.espam.edu.ec/bi}
inatrace.bi.superset.allowed-portal-origin = ${INATRACE_BI_SUPERSET_ALLOWED_PORTAL_ORIGIN:https://testinatrace.espam.edu.ec}
inatrace.bi.superset.service-username = ${INATRACE_BI_SUPERSET_SERVICE_USERNAME:bi_embed_service}
inatrace.bi.superset.service-password = ${INATRACE_BI_SUPERSET_SERVICE_PASSWORD:}
inatrace.bi.superset.guest-token-ttl-seconds = ${INATRACE_BI_SUPERSET_GUEST_TOKEN_TTL_SECONDS:300}
